<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course Chart Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a desk with one sheet of paper (the handout, recreated). Settings sit above the sheet; a floating dock at the bottom holds progress + actions. */
:root {
  --desk: #e7e9ee;
  --paper: #ffffff;
  --ink: #161616;
  --rule: #2a2a2a;
  --muted: #6a7080;
  --soft: #f2f4f7;
  --line: #d3d7df;
  --pen: #1d4ed8;
  --ok: #12804a;
  --bad: #c92a36;
  --warn: #9a6100;
  --shown: #7044d6;
  --hl: #fff3b0;
  --dock: #161a22;
  --dock-ink: #f4f5f8;
  --shadow: 0 1px 2px rgba(20,24,33,.08), 0 12px 40px rgba(20,24,33,.10);
  --f-doc: "Carlito", Calibri, "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ui: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0f1115; --paper: #1a1d24; --ink: #e8e9ec; --rule: #5b616e; --muted: #979dab; --soft: #232731; --line: #353a46;
    --pen: #8fb0ff; --ok: #52d18f; --bad: #ff7b84; --warn: #f0b54a;
    --shown: #bba5ff; --hl: #302d1b; --dock: #f1f2f5; --dock-ink: #13161c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0f1115; --paper: #1a1d24; --ink: #e8e9ec; --rule: #5b616e; --muted: #979dab; --soft: #232731; --line: #353a46;
  --pen: #8fb0ff; --ok: #52d18f; --bad: #ff7b84; --warn: #f0b54a;
  --shown: #bba5ff; --hl: #302d1b; --dock: #f1f2f5; --dock-ink: #13161c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--f-doc); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

.wrap { max-width: 900px; margin: 0 auto; padding-block: 18px 130px; }

/* ---------- settings bar ---------- */
.bar { position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; font-family: var(--f-ui); animation: drop .5s var(--ease) both; }
.brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand i { width: 18px; height: 22px; border: 2px solid currentColor; border-radius: 3px; position: relative; display: inline-block; }
.brand i::after { content: ""; position: absolute; left: 3px; right: 3px; top: 4px; height: 2px; background: currentColor; box-shadow: 0 4px 0 currentColor, 0 8px 0 currentColor; opacity: .7; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; position: relative; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: .9rem; color: var(--muted); position: relative; z-index: 1; transition: color .2s; white-space: nowrap; }
.seg button[aria-pressed="true"] { color: var(--paper); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; background: var(--ink); border-radius: 7px; transition: transform .3s var(--ease), width .3s var(--ease); }
.chipbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn:hover { border-color: var(--muted); }
.chipbtn .caret { transition: transform .2s var(--ease); }
.chipbtn[aria-expanded="true"] .caret { transform: rotate(180deg); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); transition: transform .25s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--pen); }
.switch input:checked::after { transform: translateX(14px); }

.rows-wrap { position: relative; }
.pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: 290px; max-width: calc(100vw - 32px); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; animation: popin .2s var(--ease) both; transform-origin: top left; }
.pop-step { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.stepper button { border: 0; background: transparent; width: 32px; height: 30px; font-size: 1.1rem; font-weight: 700; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.pop label { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-size: .95rem; }
.pop label:hover { background: var(--soft); }
.pop label input { width: 16px; height: 16px; accent-color: var(--pen); margin: 0; flex: none; }
.pop label small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- the paper ---------- */
.paper { background: var(--paper); box-shadow: var(--shadow); border-radius: 3px; padding: 48px 52px 56px; animation: rise .6s var(--ease) both; }
.paper.swap { animation: swap .45s var(--ease) both; }
.doc-title { font-size: 1.55rem; font-weight: 700; margin: 0 0 12px; letter-spacing: -.005em; }
.doc-intro { margin: 0 0 18px; font-size: 1rem; }
.doc-tag { display: inline-block; font-family: var(--f-ui); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; vertical-align: middle; margin-left: 8px; }

.table { position: relative; border: 1px solid var(--rule); --cols: 15% 14.5% minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
.tr { display: grid; grid-template-columns: var(--cols); border-top: 1px solid var(--rule); position: relative; z-index: 1; overflow: hidden; transition: background .35s var(--ease); }
.tr:first-child { border-top: 0; }
.tr > div { padding: 5px 7px 9px; border-left: 1px solid var(--rule); min-width: 0; }
.tr > div:first-child { border-left: 0; }
.th > div { font-weight: 700; text-align: center; padding: 3px 6px; }
.lines { display: grid; gap: 14px; }
.t { min-height: 1.4em; overflow-wrap: break-word; }
.t em { font-style: italic; }
.lbl { display: none; }

/* quiz rows */
.rowmode .tr.quiz:not(.active):not(.done-row) { cursor: pointer; }
.rowmode .tr.quiz:not(.active) .field { opacity: .45; }
.rowmode .tr.quiz.done-row .field { opacity: 1; }
.rowmode .tr.quiz:not(.active):not(.done-row):hover { background: var(--soft); }
/* the highlighter that slides to the active row */
.hl { position: absolute; left: 0; top: 0; width: 100%; height: 0; z-index: 0; background: var(--hl); opacity: 0; pointer-events: none; transition: transform .55s cubic-bezier(.65,0,.35,1), height .55s cubic-bezier(.65,0,.35,1), opacity .3s; }
.hl.on { opacity: 1; }
.hl.jump { transition: opacity .3s; }
.hl::before { content: ""; position: absolute; left: -15px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--pen); animation: pulse 1.6s ease-in-out infinite; }
.hl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--paper) 55%, transparent), transparent); transform: translateX(-100%); }
.hl.moved::after { animation: shine .8s .2s var(--ease) both; }
/* green sweep across a row that's fully right */
.tr::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ok) 30%, transparent) 45%, color-mix(in srgb, var(--ok) 30%, transparent) 55%, transparent); transform: translateX(-100%); }
.tr.sweep::after { animation: sweep .9s var(--ease) both; animation-delay: var(--sd, 0ms); }
/* printed terms <-> blank lines when the quiz rows change */
.tr.leaving .t, .tr.leaving .field { animation: leave .24s var(--ease) both; }
.tr.enter-blank .field::before { animation: drawline .5s var(--ease) both; animation-delay: calc(var(--rd, 0ms) + var(--li, 0) * 45ms); transform-origin: left; }
.tr.enter-print .t { animation: printin .45s var(--ease) both; animation-delay: calc(var(--rd, 0ms) + var(--li, 0) * 45ms); }
.field:hover::before { opacity: .95; }
/* Whole chart: every unfinished quiz row is highlighted at once */
.tr.quiz { transition: background .45s var(--ease) var(--qd, 0ms); }
#paper:not(.rowmode) .tr.quiz:not(.done-row) { background: color-mix(in srgb, var(--hl) 70%, transparent); }
.rowmode .tr.quiz:not(.active):not(.done-row):hover .field { opacity: .7; }

.field { position: relative; display: block; transition: opacity .3s; }
.field textarea { display: block; width: 100%; min-width: 0; border: 0; background: transparent; padding: 1px 22px 2px 0; margin: 0; color: var(--pen); font-family: var(--f-doc); font-size: 1rem; line-height: 1.35; border-radius: 0; resize: none; overflow: hidden; height: calc(1.35em + 3px); }
.field textarea:focus { outline: none; }
.field textarea::placeholder { color: transparent; }
.field::before, .field::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; pointer-events: none; }
.field::before { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); opacity: .55; }
.field::after { background: var(--pen); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease), background .2s; }
.field:focus-within::after { transform: scaleX(1); }
.field.ok textarea { color: var(--ok); }
.field.ok::after { background: var(--ok); transform: scaleX(1); }
.field.bad textarea { color: var(--bad); }
.field.bad::after { background: var(--bad); transform: scaleX(1); }
.field.bad { animation: shake .4s var(--ease) both; animation-delay: var(--d, 0ms); }
.field.close textarea { color: var(--warn); }
.field.close::after { background: var(--warn); transform: scaleX(1); }
.field.shown textarea { color: var(--shown); font-style: italic; }
.field.shown::after { background: var(--shown); transform: scaleX(1); opacity: .5; }
.field .peek { position: absolute; right: -2px; bottom: 1px; width: 24px; height: 22px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; border-radius: 5px; opacity: 0; transition: opacity .2s, color .2s, background .2s; padding: 0; }
.field .peek svg { width: 16px; height: 16px; }
.field:hover .peek, .field:focus-within .peek { opacity: 1; }
.field .peek:hover { color: var(--shown); background: var(--soft); }
.field.ok .peek, .field.shown .peek { display: none; }
.rowmode .tr.quiz:not(.active) .peek { display: none; }
@media (hover: none) { .field .peek { opacity: .6; } }
.field .mk { position: absolute; right: 2px; bottom: 3px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; font-weight: 700; color: var(--paper); font-family: var(--f-ui); pointer-events: none; animation: pop .35s var(--ease) both; animation-delay: var(--d, 0ms); }
.field.ok .mk { background: var(--ok); }
.field.shown .mk { background: var(--shown); }
.note { display: block; font-size: .78rem; line-height: 1.2; margin-top: 3px; font-family: var(--f-ui); animation: fadein .3s var(--ease) both; animation-delay: var(--d, 0ms); }
.field.bad + .note { color: var(--bad); }
.field.close + .note { color: var(--warn); }

.themes { margin-top: 34px; padding-top: 26px; border-top: 1px dashed var(--line); }
.themes h2 { font-size: 1.15rem; margin: 0 0 10px; }
.themes ul { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.themes li { max-width: 72ch; }
.src { margin-top: 26px; color: var(--muted); font-size: .85rem; font-family: var(--f-ui); }

/* ---------- dock ---------- */
.dock { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--dock); color: var(--dock-ink); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.28); font-family: var(--f-ui); animation: dockin .6s .25s var(--ease) both; max-width: calc(100vw - 24px); }
.prog { display: flex; align-items: center; gap: 9px; padding: 0 10px 0 8px; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog svg { width: 26px; height: 26px; transform: rotate(-90deg); flex: none; }
.prog .trk { stroke: currentColor; opacity: .2; }
.prog .val { stroke: currentColor; transition: stroke-dashoffset .45s var(--ease); }
.dbtn { border: 0; border-radius: 11px; padding: 10px 15px; font-weight: 600; font-size: .92rem; background: transparent; color: inherit; transition: background .2s, transform .15s var(--ease); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.dbtn:hover { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); }
.dbtn:active { transform: scale(.95); }
.dbtn.primary { background: var(--pen); color: var(--dock); }
.dbtn.primary:hover { background: color-mix(in srgb, var(--pen) 85%, var(--dock)); }
.dbtn.icon { padding: 10px; }
.dbtn svg { width: 17px; height: 17px; flex: none; }
.sep { width: 1px; align-self: stretch; margin: 6px 2px; background: currentColor; opacity: .18; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 21; background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 16px; font-family: var(--f-ui); font-weight: 600; font-size: .9rem; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; animation: toast 2.6s var(--ease) both; pointer-events: none; }
.toast b.g { color: var(--ok); } .toast b.r { color: var(--bad); } .toast b.y { color: var(--warn); }

/* ---------- done card ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--desk) 55%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; animation: fadein .3s both; }
.card { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 26px; width: min(380px, 100%); text-align: center; font-family: var(--f-ui); animation: cardin .5s var(--ease) both; }
.ring { width: 120px; height: 120px; margin: 0 auto 12px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--ok); transition: stroke-dashoffset 1.1s var(--ease); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.card h3 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
.card p { margin: 0 0 4px; color: var(--muted); }
.stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.stats span { font-size: .82rem; font-weight: 600; padding: 4px 9px; border-radius: 6px; background: var(--soft); font-variant-numeric: tabular-nums; }
.card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.cbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.cbtn.primary { background: var(--pen); color: var(--paper); border-color: var(--pen); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
@keyframes swap { 0% { opacity: .2; transform: translateY(10px) scale(.995); } }
@keyframes dockin { from { opacity: 0; transform: translate(-50%, 30px); } }
@keyframes popin { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes cardin { from { opacity: 0; transform: translateY(14px) scale(.96); } }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
@keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
@keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
@keyframes leave { to { opacity: 0; filter: blur(3px); transform: translateY(-4px); } }
@keyframes drawline { from { transform: scaleX(0); } }
@keyframes printin { from { opacity: 0; filter: blur(3px); transform: translateY(5px); } }

/* ---------- phones ---------- */
@media (max-width: 720px) {
  .paper { padding: 26px 18px 34px; }
  .doc-title { font-size: 1.3rem; }
  .doc-intro { font-size: .95rem; }
  .th { display: none; }
  .table { border: 0; }
  .tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 12px; }
  .hl { border-radius: 4px; }
  .tr:first-child { border-top: 1px solid var(--rule); }
  .tr > div { border-left: 0; }
  .tr > .c-dates { border-left: 1px solid var(--rule); }
  .tr > .c-col { grid-column: 1 / -1; border-top: 1px solid var(--rule); }
  .lbl { display: block; font-family: var(--f-ui); font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
  .lines { gap: 10px; }
  .hl::before { left: -12px; }
  .brand { width: 100%; }
  .dbtn { padding: 10px 11px; }
}
@media (max-width: 460px) {
  .dock { gap: 2px; padding: 5px; }
  .prog { padding: 0 6px 0 4px; gap: 6px; }
  .sep { display: none; }
  .dbtn { padding: 9px 10px; font-size: .86rem; }
  #giveBtn svg, #checkBtn svg { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><i aria-hidden="true"></i>Course Chart Drill</div>
    <div class="seg" id="courseSeg" role="group" aria-label="Class">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-v="apush">APUSH</button>
      <button type="button" data-v="world">AP World</button>
    </div>
    <div class="rows-wrap">
      <button type="button" class="chipbtn" id="rowsBtn" aria-expanded="false" aria-haspopup="true"><span id="rowsTxt">Rows 1–3</span><span class="caret" aria-hidden="true">▾</span></button>
      <div class="pop" id="rowsPop" hidden>
        <div class="pop-step">Quiz on the first
          <span class="stepper"><button type="button" id="rowsMinus" aria-label="Fewer rows">−</button><output id="rowsOut">3</output><button type="button" id="rowsPlus" aria-label="More rows">+</button></span>
        </div>
        <div id="rowsList"></div>
      </div>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="How to go through the quiz">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-v="row">Row by row</button>
      <button type="button" data-v="all">Whole chart</button>
    </div>
    <label class="switch" title="Punctuation, quotes and dashes must match the chart"><input type="checkbox" id="exact"> Exact punctuation</label>
  </header>

  <article class="paper" id="paper"></article>
</div>

<div class="dock" id="dock" role="toolbar" aria-label="Quiz actions">
  <div class="prog" aria-live="polite"><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="trk" cx="15" cy="15" r="12" fill="none" stroke-width="3"/><circle class="val" id="progVal" cx="15" cy="15" r="12" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="75.4"/></svg><span id="progTxt">0 / 0</span></div>
  <span class="sep" aria-hidden="true"></span>

<script>
(function () {

/* ================= DATA =================

const COURSES = {

      ["THEME 2: CULTURAL DEVELOPMENTS AND INTERACTIONS (CDI)", ""],
      ["THEME 3: GOVERNANCE (GOV)", ""],
      ["THEME 4: ECONOMIC SYSTEMS (ECN)", ""],
      ["THEME 5: SOCIAL INTERACTIONS AND ORGANIZATION (SIO)", ""],
      ["THEME 6: TECHNOLOGY AND INNOVATION (TEC)", ""]
    ],
    source: "Sample chart. Unit names, dates and themes follow the College Board AP World History: Modern course framework; the terms are practice picks.",
    sample: true,
    eras: [
      { name: "The Global Tapestry", dates: "1200-1450",
        b: ["Song Dynasty", "Abbasid Caliphate"],
        m: ["Delhi Sultanate", "Mali Empire"],
        e: [{ t: "Aztec Empire", alias: ["Mexica", "Aztecs"] }, { t: "Inca Empire", alias: ["Inca"] }] },
      { name: "Networks of Exchange", dates: "1200-1450",
        b: ["Mongol Empire", "Silk Roads"],
        m: ["Mansa Musa", "Ibn Battuta"],
        e: ["Black Death", { t: "Zheng He", alias: ["Zheng He’s voyages"] }] },
      { name: "Land-Based Empires", dates: "1450-1750",
        b: ["Ottoman Empire", "Safavid Empire"],
        m: ["Protestant Reformation", "Mughal Empire"],

        b: ["Columbian Exchange", "Treaty of Tordesillas"],

        e: ["Joint-Stock Companies", { t: "Atlantic Slave Trade", alias: ["Transatlantic Slave Trade"] }] },
      { name: "Revolutions", dates: "1750-1900",
        b: ["Enlightenment", "Industrial Revolution"],
        m: ["French Revolution", "Haitian Revolution"],

        b: ["Opium Wars", { t: "Sepoy Rebellion", alias: ["Sepoy Mutiny", "Indian Rebellion of 1857"] }],

        e: ["Ghost Dance", "Boxer Rebellion"] },
      { name: "Global Conflict", dates: "1900-present",
        b: ["Mexican Revolution", { t: "World War I", alias: ["World War 1", "WWI", "WW1"] }],
        m: ["Treaty of Versailles", "Great Depression"],
        e: [{ t: "World War II", alias: ["World War 2", "WWII", "WW2"] }, "Holocaust"] },
      { name: "Cold War and Decolonization", dates: "1900-present",
        b: ["Partition of India", "Truman Doctrine"],
        m: ["Non-Aligned Movement", "Cuban Missile Crisis"],
        e: ["Fall of the Berlin Wall", "End of Apartheid"] },
      { name: "Globalization", dates: "1900-present",
        b: [{ t: "Universal Declaration of Human Rights", alias: ["UDHR"] }, "Green Revolution"],
        m: ["Economic Liberalization", { t: "HIV/AIDS", alias: ["AIDS"] }],
        e: [{ t: "World Trade Organization", alias: ["WTO"] }, "Arab Spring"] }
    ]
  }
};
const COLS = [["b", "Beginning"], ["m", "Middle"], ["e", "End"]];

/* ================= HELPERS ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const T = (x) => (typeof x === "string" ? { t: x } : x);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function display(term) {
  const h = esc(term.t).replace(/\b(\d+)(st|nd|rd|th)\b/g, "$1<sup>$2</sup>");
  return term.i ? "<em>" + h + "</em>" : h;
}

// Exact: punctuation must be there; curly vs straight quotes and -/–/— count as the same,
// spacing around dashes and commas is ignored, capitals don't matter.
function normStrict(s) {
  return s.normalize("NFKC")
    .replace(/[“”„‟″"]/g, '"').replace(/[‘’‚‛′`´']/g, "'")
    .replace(/[‐‑‒–—―−]/g, "-")
    .replace(/\s*-\s*/g, "-").replace(/\s*,\s*/g, ",")
    .replace(/\s+/g, " ").trim().toLowerCase();
}
// Loose: letters and digits only, plus a few common spellings.
function normLoose(s) {
  return s.normalize("NFKC").toLowerCase()
    .replace(/&/g, " and ")
    .replace(/\b(versus|vs)\b\.?/g, " v ")
    .replace(/\bfirst\b/g, "1st").replace(/\bsecond\b/g, "2nd")
    .replace(/[^a-z0-9]/g, "");
}
function matchLevel(value, term) {
  if (!value || !value.trim()) return null;
  if (normStrict(value) === normStrict(term.t)) return "exact";
  const lv = normLoose(value);
  if (!lv) return null;
  if (lv === normLoose(term.t) || (term.alias || []).some((a) => normLoose(a) === lv)) return "loose";
  return null;
}

/* ================= SETTINGS ================= */
const S = { course: "apush", count: 3, custom: null, mode: "row", exact: true };
try { Object.assign(S, JSON.parse(localStorage.getItem("ccd2") || "{}")); } catch (e) {}
if (!COURSES[S.course]) S.course = "apush";
const save = () => { try { localStorage.setItem("ccd2", JSON.stringify(S)); } catch (e) {} };
const course = () => COURSES[S.course];
function quizRows() {
  const n = course().eras.length;
  if (S.custom && S.custom.length) return S.custom.filter((i) => i < n).sort((a, b) => a - b);
  return Array.from({ length: Math.min(Math.max(1, S.count), n) }, (_, i) => i);
}

/* ================= STATE ================= */
let cells = [], active = -1, startedAt = 0, finished = false, kept = {};

function build() {
  // keep what was typed when only the settings change
  cells.forEach((c) => { if (c.blank && c.value && c.state !== "shown") kept[c.course + "|" + c.key] = c.value; });
  const rows = new Set(quizRows());
  cells = [];
  course().eras.forEach((era, ei) => {
    const add = (kind, col, pos, term) => {
      const key = ei + "-" + col + "-" + pos;
      cells.push({ id: cells.length, course: S.course, key, era: ei, kind, col, group: ei + "-" + col, term: T(term), blank: rows.has(ei),
        value: kept[S.course + "|" + key] || "", state: "", match: null, first: null, note: "" });
    };
    add("name", "name", 0, era.name);
    add("dates", "dates", 0, era.dates);
    COLS.forEach(([k]) => era[k].forEach((t, p) => add("term", k, p, t)));
  });
  const seen = {};
  cells.forEach((c) => { c.idx = seen[c.era] = (seen[c.era] ?? -1) + 1; });
  active = S.mode === "row" ? quizRows()[0] : -1;
  finished = false; startedAt = 0;
}

/* ================= RENDER ================= */
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const COLNAME = { name: "Name", dates: "Dates", b: "Beginning", m: "Middle", e: "End" };

function fieldHTML(c) {
  if (!c.blank) return `<div class="t" style="--li:${c.idx}">${display(c.term)}</div>`;
  return `<span class="field" id="f${c.id}" style="--li:${c.idx}"><textarea id="in${c.id}" data-id="${c.id}" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="?" aria-label="${COLNAME[c.col]}, row ${c.era + 1}">${esc(c.value)}</textarea><button type="button" class="peek" data-peek="${c.id}" tabindex="-1" aria-label="Reveal this answer" title="Reveal answer (Alt+R)">${EYE}</button></span>`;
}

function renderPaper(animate) {
  const C = course();
  const rows = new Set(quizRows());
  let h = `<h1 class="doc-title">${esc(C.title)}${C.sample ? '<span class="doc-tag">Sample</span>' : ""}</h1>
    <p class="doc-intro">${esc(C.intro)}</p>
    <div class="table" id="table"><div class="hl" id="hl" aria-hidden="true"></div>
      <div class="tr th"><div>Name</div><div>Dates</div><div>Beginning</div><div>Middle</div><div>End</div></div>`;
  C.eras.forEach((era, ei) => {
    const mine = cells.filter((c) => c.era === ei);
    h += `<div class="tr${rows.has(ei) ? " quiz" : ""}" data-row="${ei}"${rows.has(ei) ? ` style="--qd:${[...rows].indexOf(ei) * 70}ms"` : ""}>
      <div class="c-name"><span class="lbl">Name</span>${fieldHTML(mine.find((c) => c.kind === "name"))}</div>
      <div class="c-dates"><span class="lbl">Dates</span>${fieldHTML(mine.find((c) => c.kind === "dates"))}</div>`;
    COLS.forEach(([k, label]) => {
      h += `<div class="c-col"><span class="lbl">${label}</span><div class="lines">${mine.filter((c) => c.col === k).map(fieldHTML).join("")}</div></div>`;
    });
    h += `</div>`;
  });
  h += `</div>
    <section class="themes"><h2>${esc(C.themesTitle)}</h2><ul>${C.themes.map(([t, d]) => `<li><b>${esc(t)}</b>${d ? " " + esc(d) : ""}</li>`).join("")}</ul></section>
    <p class="src">${esc(C.source)}</p>`;
  const paper = $("#paper");
  paper.innerHTML = h;
  if (animate) { paper.classList.remove("swap"); void paper.offsetWidth; paper.classList.add("swap"); }
  paper.classList.toggle("rowmode", S.mode === "row");
  paintRows(); progress(); dockLabels(); fitAll();
  ro.disconnect(); ro.observe($("#table"));
}

// Slide the highlighter to the active row (row-by-row mode)
let hlRow = null;
function placeHL() {
  const hl = $("#hl"); if (!hl) return;
  const tr = S.mode === "row" && active !== -1 && !finished ? $(`.tr[data-row="${active}"]`) : null;
  if (!tr) { hl.classList.remove("on"); hlRow = null; return; }
  const fresh = !hl.classList.contains("on");
  if (fresh) hl.classList.add("jump");
  hl.style.transform = `translate(${tr.offsetLeft}px, ${tr.offsetTop}px)`;
  hl.style.width = tr.offsetWidth + "px";
  hl.style.height = tr.offsetHeight + "px";
  hl.classList.add("on");
  if (fresh) { void hl.offsetWidth; hl.classList.remove("jump"); }
  else if (hlRow !== active) { hl.classList.remove("moved"); void hl.offsetWidth; hl.classList.add("moved"); }
  hlRow = active;
}
const ro = new ResizeObserver(() => placeHL());

const locked = (c) => c.state === "ok" || c.state === "shown";
const rowCells = (ei) => cells.filter((c) => c.blank && c.era === ei);
const rowDone = (ei) => rowCells(ei).every(locked);

function paintRows() {
  $$("#paper .tr.quiz").forEach((tr) => {
    const ei = +tr.dataset.row;
    const isActive = S.mode === "row" && ei === active;
    tr.classList.toggle("active", isActive);
    tr.classList.toggle("done-row", rowDone(ei));
    $$("textarea", tr).forEach((inp) => {
      const c = cells[+inp.dataset.id];
      // readOnly (not disabled) so a click or Tab into a waiting row can switch to it
      inp.readOnly = (S.mode === "row" && !isActive) || locked(c);
      inp.tabIndex = locked(c) ? -1 : 0;
    });
  });
  placeHL();
}

function paintCell(c, delay) {
  const f = $("#f" + c.id); if (!f) return;
  f.classList.remove("ok", "bad", "close", "shown");
  $$(".mk", f).forEach((n) => n.remove());
  const nx = f.nextElementSibling; if (nx && nx.classList.contains("note")) nx.remove();
  f.style.setProperty("--d", (delay || 0) + "ms");
  if (!c.state) return;
  void f.offsetWidth;
  f.classList.add(c.state);
  if (locked(c)) f.insertAdjacentHTML("beforeend", `<span class="mk" aria-hidden="true">${c.state === "ok" ? "✓" : "?"}</span>`);
  if (c.note) f.insertAdjacentHTML("afterend", `<span class="note" style="--d:${delay || 0}ms">${c.note}</span>`);
}

function progress() {
  const b = cells.filter((c) => c.blank);
  const filled = b.filter((c) => locked(c) || c.value.trim()).length;
  $("#progTxt").textContent = `${filled} / ${b.length}`;
  $("#progVal").style.strokeDashoffset = 75.4 * (1 - (b.length ? filled / b.length : 0));
}
function dockLabels() {
  const row = S.mode === "row";
  $("#checkTxt").textContent = row ? "Check row" : "Check";
  $("#giveTxt").textContent = row ? "Reveal row" : "Give up";
  $("#giveBtn").title = row ? "Show every answer in this row" : "Show every answer";
}

/* ================= SETTINGS UI ================= */
function paintSeg(seg, val) {
  const btns = $$("button", seg);
  btns.forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === val));
  const on = btns.find((b) => b.dataset.v === val);
  const th = $(".thumb", seg);
  if (on) { th.style.width = on.offsetWidth + "px"; th.style.transform = `translateX(${on.offsetLeft}px)`; }
}
function paintSettings() {
  paintSeg($("#courseSeg"), S.course);
  paintSeg($("#modeSeg"), S.mode);
  $("#exact").checked = S.exact;
  const rows = quizRows(), n = course().eras.length;
  const contiguous = rows.every((v, k) => v === k);
  $("#rowsTxt").textContent = contiguous ? (rows.length === 1 ? "Row 1" : `Rows 1–${rows.length}`) : `${rows.length} row${rows.length > 1 ? "s" : ""}`;
  $("#rowsOut").textContent = contiguous ? rows.length : "–";
  $("#rowsList").innerHTML = course().eras.map((e, i) =>
    `<label><input type="checkbox" data-row="${i}" ${rows.includes(i) ? "checked" : ""}> ${i + 1}. ${esc(e.name)} <small>${esc(T(e.dates).t)}</small></label>`).join("");
  $("#rowsMinus").disabled = contiguous && rows.length <= 1;
  $("#rowsPlus").disabled = contiguous && rows.length >= n;
}
function applySettings(animate) { save(); build(); paintSettings(); renderPaper(animate); closeDone(); }

$("#courseSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.v === S.course) return;
  S.course = b.dataset.v; S.custom = null; applySettings(true);
});
$("#modeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.v === S.mode) return;
  S.mode = b.dataset.v; save(); paintSettings();
  $("#paper").classList.toggle("rowmode", S.mode === "row");
  active = S.mode === "row" ? nextRow(-1) : -1;
  paintRows(); dockLabels(); focusFirst();
  toast(S.mode === "row" ? "Row by row: one row at a time" : "Whole chart: fill in any blank, in any order");
});
$("#exact").addEventListener("change", (e) => { S.exact = e.target.checked; save(); toast(S.exact ? "Exact punctuation on" : "Punctuation and order in a box won’t count"); });
$("#rowsBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const pop = $("#rowsPop"); pop.hidden = !pop.hidden;
  $("#rowsBtn").setAttribute("aria-expanded", String(!pop.hidden));
});
document.addEventListener("click", (e) => {
  if (!$("#rowsPop").hidden && !e.target.closest(".rows-wrap")) { $("#rowsPop").hidden = true; $("#rowsBtn").setAttribute("aria-expanded", "false"); }
});
function setCount(n) { S.custom = null; S.count = Math.min(Math.max(1, n), course().eras.length); changeRows(); }
// Fade printed terms out and draw blank lines in (or the reverse) for rows that join or leave the quiz
let rowsTimer;
function changeRows() {
  save(); paintSettings();
  const before = new Set(cells.filter((c) => c.blank).map((c) => c.era));
  const after = new Set(quizRows());
  const changed = course().eras.map((_, i) => i).filter((r) => before.has(r) !== after.has(r));
  const rebuild = () => { build(); renderPaper(false); closeDone(); };
  clearTimeout(rowsTimer);
  if (reduceMotion || !changed.length) { rebuild(); return; }
  changed.forEach((r) => { const tr = $(`.tr[data-row="${r}"]`); if (tr) tr.classList.add("leaving"); });
  rowsTimer = setTimeout(() => {
    rebuild();
    changed.forEach((r, i) => {
      const tr = $(`.tr[data-row="${r}"]`); if (!tr) return;
      tr.style.setProperty("--rd", i * 80 + "ms");
      tr.classList.add(after.has(r) ? "enter-blank" : "enter-print");
      setTimeout(() => tr.classList.remove("enter-blank", "enter-print"), 1100 + i * 80);
    });
  }, 240);
}
$("#rowsMinus").addEventListener("click", () => setCount(quizRows().length - 1));
$("#rowsPlus").addEventListener("click", () => setCount(quizRows().length + 1));
$("#rowsList").addEventListener("change", (e) => {
  const arr = $$("#rowsList input").filter((b) => b.checked).map((b) => +b.dataset.row);
  if (!arr.length) { e.target.checked = true; return; }
  if (arr.every((v, k) => v === k)) { S.custom = null; S.count = arr.length; } else S.custom = arr;
  changeRows();
});

/* ================= TYPING ================= */
function fit(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
const fitAll = () => $$(".field textarea").forEach(fit);
document.addEventListener("input", (e) => {
  const inp = e.target.closest(".field textarea"); if (!inp) return;
  if (/[\r\n]/.test(inp.value)) inp.value = inp.value.replace(/[\r\n]+/g, " ");
  fit(inp);
  const c = cells[+inp.dataset.id];
  c.value = inp.value;
  if (!startedAt) startedAt = Date.now();
  if (c.state === "bad" || c.state === "close") { c.state = ""; c.note = ""; paintCell(c); }
  progress();
});
document.addEventListener("keydown", (e) => {
  const inp = e.target.closest && e.target.closest(".field textarea");
  if (!inp) return;
  if (e.altKey && e.code === "KeyR") { e.preventDefault(); reveal([cells[+inp.dataset.id]]); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  const open = $$(".field textarea:not([readonly])");
  const i = open.indexOf(inp);
  if (i > -1 && i < open.length - 1) open[i + 1].focus();
  else check();
});
// In row-by-row mode, clicking or tabbing into a waiting row switches to it
function jumpTo(ei) {
  if (S.mode !== "row" || ei === active || finished || rowDone(ei)) return false;
  active = ei; paintRows(); return true;
}
document.addEventListener("focusin", (e) => {
  const inp = e.target.closest && e.target.closest(".field textarea"); if (!inp) return;
  const c = cells[+inp.dataset.id];
  if (!locked(c) && jumpTo(c.era)) inp.focus();
});
$("#paper").addEventListener("click", (e) => {
  const peek = e.target.closest("[data-peek]");
  if (peek) { reveal([cells[+peek.dataset.peek]]); return; }
  const tr = e.target.closest(".tr.quiz");
  if (tr && !e.target.closest("textarea") && jumpTo(+tr.dataset.row)) focusFirst();
});
function focusFirst() {
  const sel = S.mode === "row" ? `.tr[data-row="${active}"] .field textarea:not([readonly])` : ".field textarea:not([readonly])";
  const f = $(sel);
  if (!f) return;
  f.focus({ preventScroll: true });
  const r = f.getBoundingClientRect();
  if (r.top < 60 || r.bottom > innerHeight - 110) f.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
}

/* ================= CHECKING ================= */
function scope() { return cells.filter((c) => c.blank && !locked(c) && (S.mode !== "row" || c.era === active)); }

function check() {
  if (finished) return;
  const targets = scope();
  if (!targets.length) { advance(); return; }
  const groups = {};
  targets.forEach((c) => (groups[c.group] = groups[c.group] || []).push(c));
  Object.values(groups).forEach((list) => {
    const all = cells.filter((c) => c.group === list[0].group);
    const taken = new Set(all.filter(locked).map((c) => c.match));
    list.forEach((c) => { c.state = ""; c.note = ""; c.lvl = matchLevel(c.value, c.term); });
    // the right answer in its own spot
    list.forEach((c) => {
      if (taken.has(c.id)) return;
      if (c.lvl === "exact" || (c.lvl === "loose" && !S.exact)) { c.state = "ok"; c.match = c.id; taken.add(c.id); }
    });
    // a right answer that belongs on another line of the same box
    list.forEach((c) => {
      if (c.state || !c.value.trim()) return;
      const other = list.find((o) => o !== c && !taken.has(o.id) && matchLevel(c.value, o.term));
      if (other && !S.exact) { c.state = "ok"; c.match = other.id; taken.add(other.id); }
      else if (other) { c.state = "bad"; c.note = "Right term, other line"; }
      else if (c.lvl === "loose") { c.state = "close"; c.note = "Check punctuation"; }
      else c.state = "bad";
    });
  });
  let ok = 0, bad = 0, close = 0, empty = 0, k = 0;
  targets.forEach((c) => {
    if (!c.value.trim()) { empty++; return; }
    if (c.first === null) c.first = c.state === "ok";
    if (c.state === "ok") ok++; else if (c.state === "close") close++; else bad++;
    paintCell(c, Math.min(k++ * 45, 900));
  });
  paintRows(); progress();
  // green sweep over any row that is now fully right
  let sweepEnd = 0;
  [...new Set(targets.map((c) => c.era))].forEach((ei, i) => {
    if (!rowCells(ei).every((c) => c.state === "ok")) return;
    const d = Math.min(k * 45, 900) + 120 + i * 120;
    sweep(ei, d); sweepEnd = Math.max(sweepEnd, d + 500);
  });
  const parts = [];
  if (ok) parts.push(`<b class="g">${ok} right</b>`);
  if (close) parts.push(`<b class="y">${close} punctuation</b>`);
  if (bad) parts.push(`<b class="r">${bad} wrong</b>`);
  if (empty) parts.push(`${empty} blank`);
  toast(parts.join(" · "));
  if (!bad && !close && !empty) setTimeout(advance, reduceMotion ? 0 : Math.max(650, sweepEnd));
  else {
    const miss = targets.find((c) => !locked(c));
    if (miss) setTimeout(() => { const i = $("#in" + miss.id); if (i) i.focus({ preventScroll: true }); }, 250);
  }
}

function nextRow(from) {
  const rows = quizRows().filter((r) => !rowDone(r));
  const after = rows.find((r) => r > from);
  return after !== undefined ? after : rows.length ? rows[0] : -1;
}
function advance() {
  if (S.mode === "row") {
    const nx = nextRow(active);
    if (nx === -1) { active = -1; paintRows(); finish(); return; }
    if (nx === active) return;
    active = nx; paintRows(); setTimeout(focusFirst, 150);
  } else if (cells.filter((c) => c.blank).every(locked)) finish();
}

function sweep(ei, delay) {
  const tr = $(`.tr[data-row="${ei}"]`); if (!tr || reduceMotion) return;
  tr.classList.remove("sweep"); void tr.offsetWidth;
  tr.style.setProperty("--sd", delay + "ms");
  tr.classList.add("sweep");
}

/* ================= REVEAL ================= */
function typeInto(inp, text, delay) {
  if (reduceMotion) { inp.value = text; fit(inp); return; }
  inp.value = "";
  setTimeout(() => {
    let i = 0;
    const t = setInterval(() => { inp.value = text.slice(0, ++i); fit(inp); if (i >= text.length) clearInterval(t); }, 18);
  }, delay);
}
function reveal(list) {
  if (finished) return;
  let k = 0, end = 0;
  list = list.filter((c) => c.blank && !locked(c));
  if (!list.length) return;
  list.forEach((c) => {
    // if a swapped answer already used this spot's term, show the term that is still missing
    const all = cells.filter((o) => o.group === c.group);
    const taken = new Set(all.filter(locked).map((o) => o.match));
    const target = !taken.has(c.id) ? c : all.find((o) => !taken.has(o.id)) || c;
    c.state = "shown"; c.note = ""; c.match = target.id;
    if (c.first === null) c.first = false;
    c.value = target.term.t;
    const d = Math.min(k++ * 60, 1500);
    paintCell(c, d);
    const inp = $("#in" + c.id); if (inp) typeInto(inp, c.value, d);
    end = Math.max(end, d + c.value.length * 18);
  });
  paintRows(); progress();
  const wait = reduceMotion ? 0 : Math.min(end, 1600) + 300;
  if (S.mode === "row" && active !== -1 && rowDone(active)) setTimeout(advance, wait);
  else if (cells.filter((c) => c.blank).every(locked)) setTimeout(finish, wait);
  else if (list.length === 1) {
    const open = $$(".field textarea:not([readonly])");
    const nx = open.find((i) => +i.dataset.id > list[0].id) || open[0];
    if (nx) nx.focus({ preventScroll: true });
  }
}
$("#giveBtn").addEventListener("click", () => reveal(S.mode === "row" ? rowCells(active) : cells.filter((c) => c.blank)));
$("#checkBtn").addEventListener("click", check);
function restart() { kept = {}; cells.forEach((c) => (c.value = "")); applySettings(true); setTimeout(focusFirst, 300); }
$("#resetBtn").addEventListener("click", () => { restart(); toast("Cleared"); });

/* ================= FINISH ================= */
function finish() {
  if (finished) return;
  finished = true;
  const b = cells.filter((c) => c.blank);
  const ok = b.filter((c) => c.state === "ok").length;
  const shown = b.length - ok;
  const firstTry = b.filter((c) => c.first === true).length;
  const pct = Math.round(ok / b.length * 100);
  const secs = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const head = shown === 0 ? (firstTry === b.length ? "Perfect chart" : "Chart complete") : pct >= 75 ? "Nice work" : "Keep at it";
  const C = 2 * Math.PI * 52;
  $("#doneSlot").innerHTML = `<div class="scrim" id="scrim"><div class="card" role="dialog" aria-modal="true" aria-labelledby="doneH">
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="val" id="ringV" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="num" id="ringN">0%</div></div>
    <h3 id="doneH">${head}</h3>
    <p>${ok} of ${b.length} filled in from memory${secs ? ` in ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}` : ""}</p>
    <div class="stats"><span>${firstTry} right first try</span><span>${ok - firstTry} fixed after a miss</span><span>${shown} revealed</span></div>
    <div class="btns"><button type="button" class="cbtn primary" id="againBtn">Try again</button><button type="button" class="cbtn" id="reviewBtn">Look over the chart</button></div>
  </div></div>`;
  const ring = $("#ringV");
  if (pct < 50) ring.style.stroke = "var(--bad)"; else if (pct < 85) ring.style.stroke = "var(--warn)";
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = C * (1 - pct / 100); }));
  countUp($("#ringN"), pct);
  if (shown === 0) confetti();
  $("#againBtn").addEventListener("click", restart);
  $("#reviewBtn").addEventListener("click", closeDone);
  $("#scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeDone(); });
  setTimeout(() => { const a = $("#againBtn"); if (a) a.focus(); }, 50);
}
function closeDone() { $("#doneSlot").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDone(); $("#rowsPop").hidden = true; $("#rowsBtn").setAttribute("aria-expanded", "false"); } });
function countUp(el, to) {
  if (reduceMotion) { el.textContent = to + "%"; return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 1100); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

let toastTimer;
function toast(html) {
  if (!html) return;
  const slot = $("#toastSlot");
  slot.innerHTML = `<div class="toast" role="status">${html}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (slot.innerHTML = ""), 2700);
}

function confetti() {
  if (reduceMotion) return;
  const cv = $("#confetti"); cv.hidden = false;
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--pen", "--ok", "--hl", "--shown", "--warn"].map((v) => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 130 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 140, y: innerHeight * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 11 - 4, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    const k = (t - t0) / 1800;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach((p) => { p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (k < 1) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

const repaintSegs = () => { paintSeg($("#courseSeg"), S.course); paintSeg($("#modeSeg"), S.mode); };
addEventListener("resize", () => { repaintSegs(); fitAll(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { repaintSegs(); fitAll(); });

build(); paintSettings(); renderPaper(false);
})();
</script>
</body>
</html>
